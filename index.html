<script>
'use strict';

/*
 * เปลี่ยน URL ตรงนี้เท่านั้น
 * ต้องเป็น URL Google Apps Script Web App ที่ลงท้าย /exec
 */
const SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycbwe3KvdPOBpzlJLdGQLfFm2u1pkTKkT5idgIG79IVg944QI69imwWY52MKs2nu5aZbvDw/exec';

const $ = id => document.getElementById(id);
const TOTAL_STUDENTS = 40;

let token = sessionStorage.getItem('hm_token') || '';
let user = null;
let tasks = [];
let dailyEvents = {};
let codes = [];
let subjects = [];
let selectedDateStr = dateStr(new Date());
let currentDateTime = new Date();
let lastActivity = Date.now();
let saving = false;

function dateStr(d) {
  return [
    d.getFullYear(),
    String(d.getMonth() + 1).padStart(2, '0'),
    String(d.getDate()).padStart(2, '0')
  ].join('-');
}

function fmt(s) {
  if (!s) return '-';
  const d = new Date(String(s).slice(0, 10) + 'T12:00:00');
  return isNaN(d.getTime())
    ? String(s)
    : d.toLocaleDateString('th-TH', {
        day: 'numeric',
        month: 'short',
        year: 'numeric'
      });
}

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[c]));
}

function admin() {
  return user && ['admin', 'creator'].includes(user.role);
}

function alertError(error) {
  alert(error?.message || String(error));
}

function api(action, params = {}) {
  return new Promise((resolve, reject) => {
    if (!SCRIPT_URL.startsWith('https://script.google.com/macros/s/')) {
      reject(Error('กรุณาตั้งค่า SCRIPT_URL'));
      return;
    }

    const callback = 'hwcb_' +
      Math.random().toString(36).slice(2) +
      Date.now();

    const script = document.createElement('script');
    let done = false;

    const timeout = setTimeout(() => {
      finish(Error('เชื่อมต่อ Google Sheets ไม่สำเร็จ'));
    }, 20000);

    function finish(error, data) {
      if (done) return;
      done = true;
      clearTimeout(timeout);
      script.remove();
      delete window[callback];
      if (error) reject(error);
      else resolve(data);
    }

    window[callback] = data => {
      if (!data || data.ok === false) {
        finish(Error(data?.error || 'เกิดข้อผิดพลาด'));
      } else {
        finish(null, data);
      }
    };

    script.onerror = () => finish(Error('โหลด API ไม่สำเร็จ'));

    const url = new URL(SCRIPT_URL);
    url.searchParams.set('action', action);
    url.searchParams.set('callback', callback);

    if (token) url.searchParams.set('token', token);

    Object.entries(params).forEach(([key, value]) => {
      url.searchParams.set(key, value);
    });

    script.src = url.toString();
    document.head.appendChild(script);
  });
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function mutate(action, payload = {}) {
  if (saving) throw Error('กำลังบันทึกข้อมูล กรุณารอสักครู่');
  saving = true;

  const requestId =
    'xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'.replace(/x/g, () =>
      Math.floor(Math.random() * 16).toString(16)
    );

  try {
    const body = {
      action,
      token,
      requestId,
      ...payload
    };

    await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    });

    let result = null;

    for (let i = 0; i < 12; i++) {
      await sleep(1000);

      const receipt = await api('receipt', { id: requestId });

      if (!receipt.pending) {
        result = receipt.result;
        break;
      }
    }

    if (!result) {
      throw Error('ยังยืนยันผลการบันทึกไม่ได้ กรุณารีเฟรชตรวจสอบข้อมูลก่อนลองอีกครั้ง');
    }

    if (!result.ok) {
      throw Error(result.error || 'บันทึกไม่สำเร็จ');
    }

    await fetchAllData(false);
    return result;
  } finally {
    saving = false;
  }
}

async function login() {
  const username = $('username').value.trim();

  if (!username) {
    $('login-error').textContent = 'กรุณากรอก Username';
    return;
  }

  $('login-btn').disabled = true;
  $('login-error').textContent = 'กำลังตรวจสอบชื่อผู้ใช้...';

  try {
    const response = await api('login', { username });

    token = response.token;
    user = response.user;

    sessionStorage.setItem('hm_token', token);

    await fetchAllData(false);
    openDashboard();

    $('login-error').textContent = '';
  } catch (error) {
    $('login-error').textContent = error.message;
    token = '';
    user = null;
    sessionStorage.removeItem('hm_token');
  } finally {
    $('login-btn').disabled = false;
  }
}

function logout() {
  token = '';
  user = null;
  sessionStorage.removeItem('hm_token');

  $('main-page').classList.add('hidden');
  $('login-page').classList.remove('hidden');
}

function openDashboard() {
  $('login-page').classList.add('hidden');
  $('main-page').classList.remove('hidden');

  $('guest-badge').textContent = user.name || user.username;
  switchTab('pending');
}

async function fetchAllData(notify = false) {
  try {
    const response = await api('data');

    user = response.user;

    tasks = (response.tasks || []).map(t => ({
      ...t,
      id: String(t.id),
      submitted: (t.submitted || []).map(String),
      extraUnsubmitted: (t.extraUnsubmitted || []).map(String)
    }));

    dailyEvents = response.events || {};
    codes = response.options?.codes || [];
    subjects = response.options?.subjects || [];

    renderTasks();
    renderCalendar();
    selectDate(selectedDateStr);
    updateDatalists();

    if (notify) alert('ซิงค์ข้อมูลล่าสุดแล้ว');
    return true;
  } catch (error) {
    if (/เซสชัน|เข้าสู่ระบบใหม่/.test(error.message)) {
      logout();
    }
    if (notify) alertError(error);
    throw error;
  }
}

function switchTab(tab) {
  for (const key of ['pending', 'calendar', 'tracking']) {
    const button = $('tab-' + key);

    const selected = key === tab;

    button.className =
      'flex-1 p-2 rounded-xl ' +
      (selected
        ? key === 'pending'
          ? 'bg-[#FF75BC] text-white'
          : key === 'calendar'
            ? 'bg-[#50D8FF] text-slate-900'
            : 'bg-purple-600 text-white'
        : 'text-slate-500');
  }

  $('view-tasks').classList.toggle('hidden', tab !== 'pending');
  $('view-calendar').classList.toggle('hidden', tab !== 'calendar');
  $('view-tracking').classList.toggle('hidden', tab !== 'tracking');
}

function unsubmitted(task) {
  const sent = new Set(task.submitted.map(String));
  const extra = new Set(task.extraUnsubmitted.map(String));

  return [
    ...Array.from(
      { length: TOTAL_STUDENTS },
      (_, i) => String(i + 1)
    ).filter(n => !sent.has(n)),
    ...[...extra].filter(n =>
      !sent.has(n) && Number(n) > TOTAL_STUDENTS
    )
  ];
}

function taskCard(task, tracking = false) {
  const due = new Date(task.dueDate + 'T12:00:00');
  const today = new Date(dateStr(new Date()) + 'T12:00:00');

  const diff = Math.round((due - today) / 86400000);
  const missing = unsubmitted(task);

  const total = TOTAL_STUDENTS +
    task.extraUnsubmitted.filter(n => Number(n) > TOTAL_STUDENTS).length;

  const sent = Math.max(0, total - missing.length);
  const percent = total
    ? Math.max(0, Math.min(100, Math.round(sent / total * 100)))
    : 0;

  const status = isNaN(diff)
    ? 'ไม่ระบุวันส่ง'
    : diff < 0
      ? 'เลยกำหนด ' + (-diff) + ' วัน'
      : diff === 0
        ? 'กำหนดส่งวันนี้'
        : 'เหลือ ' + diff + ' วัน';

  const badges = missing.map(n => `
    <span class="inline-flex bg-rose-50 text-rose-600 rounded-lg border px-2 py-1 text-[10px] gap-1">
      <button data-action="submit" data-id="${esc(task.id)}" data-num="${esc(n)}">
        ${esc(n)}
      </button>
      ${admin() && task.extraUnsubmitted.includes(n)
        ? `<button data-action="remove" data-id="${esc(task.id)}" data-num="${esc(n)}">×</button>`
        : ''}
    </span>
  `).join('');

  return `
    <article class="bg-white p-3.5 rounded-2xl border shadow-sm space-y-2">

      <div class="flex justify-between gap-2">

        <div class="min-w-0">
          <span class="text-[10px] bg-pink-100 text-pink-700 rounded-md px-2 py-1 font-bold">
            ${esc(task.code)}
          </span>

          <b class="text-xs">${esc(task.subject)}</b>

          <p class="text-xs mt-2 break-words">${esc(task.detail)}</p>

          <p class="text-[10px] text-rose-500 mt-1">
            กำหนดส่ง: ${fmt(task.dueDate)}
          </p>
        </div>

        <div class="flex gap-1 shrink-0">
          <button data-action="pin" data-id="${esc(task.id)}"
            class="bg-amber-100 text-amber-700 rounded-xl p-2 text-xs">
            <i class="fa-solid fa-thumbtack"></i>
          </button>

          ${admin()
            ? `<button data-action="delete" data-id="${esc(task.id)}"
                class="bg-rose-50 text-rose-500 rounded-xl p-2 text-xs">
                <i class="fa-solid fa-trash"></i>
              </button>`
            : ''}
        </div>
      </div>

      ${tracking ? `
        <p class="text-xs font-bold">${status}</p>

        <div class="w-full bg-slate-100 h-2 rounded-full">
          <div class="bg-emerald-500 h-2 rounded-full"
            style="width:${percent}%"></div>
        </div>

        <p class="text-[10px] text-emerald-600 font-bold">
          ${sent}/${total} ส่งแล้ว (${percent}%)
        </p>
      ` : ''}

      ${(tracking || diff < 0) ? `
        <div class="border-t pt-2">
          <p class="text-[10px] font-bold text-rose-600 mb-2">
            ยังไม่ส่ง (${missing.length})
          </p>

          <div class="flex flex-wrap gap-1">
            ${badges || '<span class="text-emerald-600 text-xs">ส่งครบแล้ว 🎉</span>'}
          </div>
        </div>
      ` : ''}

    </article>
  `;
}

function renderTasks() {
  const pinned = tasks.filter(t => t.isPinned);
  const normal = tasks.filter(t => !t.isPinned);

  $('pinned-list').innerHTML =
    pinned.map(t => taskCard(t)).join('') ||
    '<p class="text-xs text-amber-600">ไม่มีรายการปักหมุด</p>';

  $('task-list').innerHTML =
    normal.map(t => taskCard(t)).join('') ||
    '<p class="text-xs text-center text-slate-400 p-4">ไม่มีงานค้างในระบบ</p>';

  $('tracking-task-list').innerHTML =
    tasks.map(t => taskCard(t, true)).join('') ||
    '<p class="text-xs">ไม่มีรายการงานค้าง</p>';

  $('task-count').textContent = tasks.length + ' ITEMS';
  $('tracking-count').textContent = tasks.length + ' ITEMS';

  $('select-target-task').innerHTML = tasks.map(t => `
    <option value="${esc(t.id)}">
      ${esc(t.code)} - ${esc(t.subject)}
    </option>
  `).join('');
}

document.addEventListener('click', async event => {
  const button = event.target.closest('[data-action]');
  if (!button) return;

  const id = button.dataset.id;
  const number = button.dataset.num;
  const action = button.dataset.action;

  try {
    if (action === 'delete') {
      if (!confirm('ลบการบ้านนี้ใช่หรือไม่?')) return;
      await mutate('deleteTask', { id });
    }

    if (action === 'pin') {
      await mutate('togglePin', { id });
    }

    if (action === 'submit') {
      if (!admin()) {
        alert('เฉพาะแอดมินสามารถเปลี่ยนสถานะส่งงานได้');
        return;
      }
      await mutate('toggleSubmit', { id, number });
    }

    if (action === 'remove') {
      await mutate('removeStudent', { id, number });
    }
  } catch (error) {
    alertError(error);
  }
});

function toggleForm(id) {
  if (!admin()) {
    alert('เฉพาะแอดมินเท่านั้น');
    return;
  }

  const other = id === 'tracking-admin-form'
    ? 'tracking-student-form'
    : 'tracking-admin-form';

  $(other).classList.add('hidden');
  $(id).classList.toggle('hidden');
}

async function addTrackingTask() {
  const task = {
    code: $('tracking-task-code').value.trim(),
    subject: $('tracking-task-subject').value.trim(),
    detail: $('tracking-task-detail').value.trim(),
    assignDate: $('tracking-assign-date').value,
    dueDate: $('tracking-due-date').value
  };

  if (!task.code || !task.subject || !task.detail || !task.dueDate) {
    alert('กรุณากรอกข้อมูลให้ครบ');
    return;
  }

  try {
    await mutate('addTask', { task });

    $('tracking-admin-form').classList.add('hidden');
    $('tracking-task-detail').value = '';

    alert('บันทึกการบ้านสำเร็จ');
  } catch (error) {
    alertError(error);
  }
}

async function submitExtraStudent() {
  const id = $('select-target-task').value;
  const number = $('extra-student-name').value.trim();

  if (!id || !/^\d+$/.test(number) || Number(number) < 1) {
    alert('กรุณาระบุการบ้านและเลขที่ให้ถูกต้อง');
    return;
  }

  try {
    await mutate('addStudent', { id, number });

    $('extra-student-name').value = '';
    $('tracking-student-form').classList.add('hidden');

    alert('บันทึกเลขที่สำเร็จ');
  } catch (error) {
    alertError(error);
  }
}

function renderCalendar() {
  const year = currentDateTime.getFullYear();
  const month = currentDateTime.getMonth();

  $('calendar-month-year').textContent =
    currentDateTime.toLocaleDateString('th-TH', {
      month: 'long',
      year: 'numeric'
    });

  let html = '';

  const offset = new Date(year, month, 1).getDay();

  for (let i = 0; i < offset; i++) {
    html += '<span></span>';
  }

  const days = new Date(year, month + 1, 0).getDate();

  for (let day = 1; day <= days; day++) {
    const date = [
      year,
      String(month + 1).padStart(2, '0'),
      String(day).padStart(2, '0')
    ].join('-');

    const hasTask = tasks.some(t =>
      t.dueDate === date || t.assignDate === date
    );

    const hasEvent = (dailyEvents[date] || []).length > 0;

    html += `
      <button
        data-date="${date}"
        class="h-9 rounded-xl text-xs font-bold relative ${
          date === selectedDateStr
            ? 'bg-[#50D8FF]'
            : 'bg-slate-50'
        }">
        ${day}
        ${hasTask || hasEvent
          ? '<span class="absolute bottom-1 left-1/2 -translate-x-1/2 w-1 h-1 bg-[#FF75BC] rounded-full"></span>'
          : ''}
      </button>
    `;
  }

  $('calendar-days').innerHTML = html;
}

$('calendar-days').addEventListener('click', event => {
  const button = event.target.closest('[data-date]');
  if (button) selectDate(button.dataset.date);
});

function changeMonth(direction) {
  currentDateTime = new Date(
    currentDateTime.getFullYear(),
    currentDateTime.getMonth() + direction,
    1
  );

  renderCalendar();
}

function selectDate(date) {
  selectedDateStr = date;
  renderCalendar();

  $('selected-date-label').textContent =
    'รายการวันที่ ' + fmt(date);

  const selectedTasks = tasks.filter(t =>
    t.dueDate === date || t.assignDate === date
  );

  $('selected-task-count').textContent =
    selectedTasks.length + ' รายการ';

  $('selected-date-tasks').innerHTML =
    selectedTasks.map(t => taskCard(t)).join('') ||
    '<p class="text-xs text-slate-400">ไม่มีรายการในวันนี้</p>';

  $('event-list-view').innerHTML =
    (dailyEvents[date] || []).map(event => `
      <p class="bg-white rounded-xl p-2 text-xs">
        ${esc(event)}
      </p>
    `).join('') ||
    '<p class="text-xs text-sky-600">ไม่มีกิจกรรมพิเศษ</p>';
}

function openEventModal() {
  $('modal-date-label').textContent =
    'วันที่เลือก: ' + fmt(selectedDateStr);

  $('event-modal').classList.remove('hidden');
}

function closeModal(id) {
  $(id).classList.add('hidden');
}

async function saveDailyEvent() {
  const event = $('daily-event-input').value.trim();

  if (!event) {
    alert('กรุณากรอกชื่อกิจกรรม');
    return;
  }

  try {
    await mutate('addEvent', {
      date: selectedDateStr,
      event
    });

    $('daily-event-input').value = '';
    closeModal('event-modal');

    alert('บันทึกกิจกรรมสำเร็จ');
  } catch (error) {
    alertError(error);
  }
}

function updateDatalists() {
  $('code-options').innerHTML = codes.map(code => `
    <option value="${esc(code)}"></option>
  `).join('');

  $('subject-options').innerHTML = subjects.map(subject => `
    <option value="${esc(subject)}"></option>
  `).join('');
}

function openManageModal() {
  $('manage-modal').classList.remove('hidden');

  $('manage-codes').innerHTML =
    codes.map(code => `
      <p class="bg-white rounded-lg p-2">${esc(code)}</p>
    `).join('') || 'ไม่มีข้อมูล';

  $('manage-subjects').innerHTML =
    subjects.map(subject => `
      <p class="bg-white rounded-lg p-2">${esc(subject)}</p>
    `).join('') || 'ไม่มีข้อมูล';
}

async function refreshManage() {
  try {
    await fetchAllData(false);
    openManageModal();
  } catch (error) {
    alertError(error);
  }
}

function openLogsModal() {
  if (!admin()) {
    alert('เฉพาะแอดมินดูประวัติได้');
    return;
  }

  $('logs-modal').classList.remove('hidden');
  loadLogs();
}

async function loadLogs() {
  try {
    const response = await api('logs');

    $('logs-status').textContent =
      'พบ ' + response.logs.length + ' รายการ';

    $('logs-list').innerHTML =
      response.logs.map(log => `
        <div class="bg-slate-50 p-3 rounded-xl text-xs">
          <b>${esc(log.username)}</b>
          · ${esc(log.action)}
          <p>${esc(log.details)}</p>
          <small>${esc(log.timestamp)}</small>
        </div>
      `).join('') ||
      '<p class="text-xs text-slate-400">ไม่มีประวัติ</p>';
  } catch (error) {
    $('logs-status').textContent = error.message;
  }
}

async function clearLogs() {
  if (!confirm('ล้างประวัติทั้งหมด?')) return;

  try {
    await mutate('clearLogs');
    await loadLogs();
    alert('ล้างประวัติสำเร็จ');
  } catch (error) {
    alertError(error);
  }
}

['click', 'touchstart', 'keydown', 'scroll'].forEach(name => {
  document.addEventListener(name, () => {
    lastActivity = Date.now();
  }, { passive: true });
});

setInterval(() => {
  if (token && Date.now() - lastActivity > 7 * 60 * 1000) {
    logout();
    alert('เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่');
  }
}, 30000);

if (token) {
  fetchAllData(false)
    .then(() => openDashboard())
    .catch(() => logout());
}
</script>
