<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homework M.113</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }

    body { 
      font-family: 'Plus Jakarta Sans', 'Sarabun', sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #fbcfe8 0%, #e9d5ff 50%, #bae6fd 100%);
    }

    .hidden { display: none !important; }

    .app-layout {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 14px 20px 14px;
    }

    .app-card {
      width: 100%;
      margin-left: auto;
      margin-right: auto;
    }

    @keyframes pop {
      from { opacity: 0; transform: scale(.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .animate-pop { animation: pop .2s ease-out; }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    input, select { outline: none; }
    input:focus, select:focus { border-color: #ec4899 !important; box-shadow: 0 0 0 2px rgba(236, 72, 153, 0.2); }
  </style>
</head>

<body>

  <div id="loading-overlay" class="fixed inset-0 bg-slate-900/30 backdrop-blur-sm z-[100] hidden flex items-center justify-center">
    <div class="bg-white rounded-3xl p-6 shadow-2xl text-center min-w-[180px]">
      <div class="w-8 h-8 border-4 border-pink-400 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
      <p id="loading-text" class="text-xs font-bold text-slate-600">กำลังโหลด...</p>
    </div>
  </div>

  <div class="app-layout">

    <div></div>

    <!-- Login Page -->
    <div id="login-page" class="app-card max-w-sm bg-white/95 backdrop-blur-xl rounded-3xl p-8 shadow-2xl border border-white text-center">
      <div class="w-16 h-16 mx-auto bg-gradient-to-br from-pink-500 via-purple-500 to-indigo-500 rounded-2xl flex items-center justify-center text-white text-3xl mb-4 shadow-lg shadow-purple-200">
        <i class="fa-solid fa-book-open-reader"></i>
      </div>

      <h1 class="text-xl font-extrabold text-slate-800 mb-1">Homework M.113</h1>
      <p class="text-[11px] text-slate-500 font-bold mb-6">ระบบการบ้านห้อง M.113</p>

      <div class="text-left mb-4">
        <label class="text-[11px] font-bold text-slate-600 ml-1">ชื่อผู้ใช้งาน (USERNAME)</label>
        <input id="username" type="text" placeholder="พิมพ์ชื่อผู้ใช้งานของคุณ"
          class="w-full mt-1 p-3 rounded-2xl bg-slate-50 border border-slate-200 text-sm font-semibold text-slate-700 transition"
          onkeydown="if(event.key==='Enter')login()">
      </div>

      <button id="login-btn" onclick="login()"

        เข้าสู่ระบบทันที

    </div>

    <!-- Main Page -->
    <main id="main-page" class="app-card hidden max-w-md bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl p-6 border border-white">

        <div class="flex items-center gap-1.5">

          <div class="mb-3">

      <section id="view-tracking" class="hidden">

    <!-- ปุ่มการส่งการบ้านด้านล่างสุด -->

      <button onclick="showAlert('ระบบส่งการบ้านเปิดใช้งานปกติ')" class="bg-white/95 backdrop-blur-md text-slate-700 text-xs font-bold px-8 py-2.5 rounded-full border border-white shadow-sm hover:bg-white transition">

  <div id="modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">

        <button onclick="closeModal()" class="text-slate-500 font-bold hover:text-slate-700">✕</button>
      </div>

  <!-- Custom Alert Modal -->
  <div id="custom-alert" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[120] hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 w-full max-w-xs animate-pop shadow-2xl text-center">
      <div class="w-12 h-12 mx-auto bg-pink-50 text-pink-500 rounded-2xl flex items-center justify-center text-xl mb-3 shadow-inner">
        <i class="fa-solid fa-circle-info"></i>
      </div>
      <h3 class="font-extrabold text-sm text-slate-800 mb-1">แจ้งเตือน</h3>
      <p id="alert-text" class="text-xs text-slate-500 font-semibold mb-5"></p>
      <button onclick="closeAlert()" class="w-full bg-pink-500 text-white py-2.5 rounded-xl text-xs font-extrabold hover:bg-pink-600 transition shadow-sm">ปิด</button>
    </div>

<script>
'use strict';

const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxPMdLygwBXKBmasT3GM-MsfhlPvaVpd31_epFbbcNFWyGghIBLEevaZO0b5Rbq9c2iQA/exec';

let currentUser = null;
let tasks = [];
let dailyEvents = {};
let codes = [];
let subjects = [];
let currentTab = 'pending';
let calendarDate = new Date();
let selectedDate = dateKey(new Date());
let isAllLogsLoaded = false;

const TOTAL_STUDENTS = 40;
let busy = false;

function el(id) { return document.getElementById(id); }

function showAlert(message) {
  el('alert-text').textContent = message;
  el('custom-alert').classList.remove('hidden');
}

function closeAlert() {
  el('custom-alert').classList.add('hidden');
}

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function dateKey(date) {
  return date.getFullYear() + '-' +
    String(date.getMonth() + 1).padStart(2, '0') + '-' +
    String(date.getDate()).padStart(2, '0');
}

function normalizeDateStr(value) {
  if (!value) return '';
  const str = String(value).trim();
  if (str.includes('T')) return str.substring(0, 10);
  if (str.length >= 10 && str.charAt(4) === '-' && str.charAt(7) === '-') return str.substring(0, 10);
  const d = new Date(str);
  if (!isNaN(d.getTime())) return dateKey(d);
  return str;
}

function formatDate(value) {
  if (!value) return '-';
  const str = String(value);
  const d = new Date(str.includes('T') ? str : str.substring(0, 10) + 'T12:00:00');
  if (!isNaN(d.getTime())) {
    return d.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' });
  }
  return str;
}

function showLoading(text = 'กำลังโหลด...') {
  el('loading-text').textContent = text;
  el('loading-overlay').classList.remove('hidden');
}

function hideLoading() { el('loading-overlay').classList.add('hidden'); }

function setStatus(message, success = true) {
  const box = el('sync-status');
  box.textContent = message;
  box.className = 'p-2.5 rounded-2xl text-[11px] font-bold mb-4 text-center border ' +
    (success ? 'bg-emerald-50 text-emerald-600 border-emerald-100' : 'bg-rose-50 text-rose-600 border-rose-100');
}

async function fetchJSON(url, timeoutMs = 12000) {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const res = await fetch(url, { method: 'GET', redirect: 'follow', signal: controller.signal });
    clearTimeout(timeoutId);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  } catch (err) {
    clearTimeout(timeoutId);
    if (err.name === 'AbortError') throw new Error('การเชื่อมต่อหมดเวลา (Timeout)');
    throw err;
  }
}

async function execute(label, action) {
  if (busy) return false;
  busy = true;
  showLoading(label);
  try {
    await action();
    return true;
  } catch (error) {
    console.error(error);
    setStatus('ผิดพลาด: ' + error.message, false);
    showAlert(error.message || 'เกิดข้อผิดพลาด');
    return false;
  } finally {
    busy = false;
    hideLoading();
  }
}

function isAdmin() { return currentUser && ['admin', 'creator'].includes(currentUser.role); }

function updateAdminUI() {
  const isUserAdmin = isAdmin();
  if (isUserAdmin) {
    el('btn-logs').classList.remove('hidden');
    el('btn-logs').classList.add('flex');
    el('btn-options').classList.remove('hidden');
    el('btn-options').classList.add('flex');
  } else {
    el('btn-logs').classList.add('hidden');
    el('btn-logs').classList.remove('flex');
    el('btn-options').classList.add('hidden');
    el('btn-options').classList.remove('flex');
  }
}

async function login() {
  let inputVal = el('username').value.trim();
  if (!inputVal) {
    showAlert('กรุณากรอกชื่อผู้ใช้งาน');
    return;
  }

  if (inputVal.toLowerCase() === 'admin') {
    showAlert('ไม่พบบัญชี');
    return;
  }

  await execute('กำลังตรวจสอบขื่อผู้ใช้...', async () => {
    const res = await fetchJSON(`${SCRIPT_URL}?action=checkLogin&username=${encodeURIComponent(inputVal)}&t=${Date.now()}`);
    
    if (res && res.success && res.user) {
      currentUser = {
        username: res.user.username,
        role: res.user.role,
        name: res.user.name
      };

      localStorage.setItem('homeworkLastUser', currentUser.username);
      sessionStorage.setItem('homeworkUser', JSON.stringify(currentUser));

      el('login-page').classList.add('hidden');
      el('main-page').classList.remove('hidden');
      el('user-display').textContent = currentUser.name;

      updateAdminUI();
      switchTab('pending'); // กำหนดให้เปิดเข้าหน้า "ภาพรวมงานค้าง" เป็นหน้าแรกเสมอ

      await loadAllData(false);
      logActivity('เข้าสู่ระบบ', `ผู้ใช้งาน ${currentUser.name} เข้าสู่ระบบสำเร็จ`);
    } else {
      throw new Error(res.error || 'ไม่พบบัญชี');
    }
  });
}

function logout() {
  logActivity('ออกจากระบบ', `ผู้ใช้งาน ${currentUser ? currentUser.name : 'Unknown'} ออกจากระบบ`);
  currentUser = null;
  sessionStorage.removeItem('homeworkUser');
  localStorage.removeItem('homeworkCacheData');
  location.reload();
}

async function loadAllData(showMessage = false) {
  const cachedData = localStorage.getItem('homeworkCacheData');
  if (cachedData) {
    try {
      const parsed = JSON.parse(cachedData);
      tasks = parsed.tasks || [];
      dailyEvents = parsed.events || {};
      codes = parsed.options?.codes || [];
      subjects = parsed.options?.subjects || [];
      updateOptions();
      renderTasks();
      renderCalendar();
      selectDate(selectedDate);
    } catch(e) {}
  }

  const load = async () => {
    const res = await fetchJSON(`${SCRIPT_URL}?t=${Date.now()}`);
    if (res) {
      tasks = Array.isArray(res.tasks) ? res.tasks : [];
      dailyEvents = res.events || {};
      codes = res.options?.codes || [];
      subjects = res.options?.subjects || [];

      localStorage.setItem('homeworkCacheData', JSON.stringify(res));

      updateOptions();
      renderTasks();
      renderCalendar();
      selectDate(selectedDate);

      setStatus('ซิงค์ข้อมูลสำเร็จ • ' + new Date().toLocaleTimeString('th-TH'));
      if (showMessage) showAlert('ซิงค์ข้อมูลสำเร็จ');
    }
  };

  if (busy) await load();
  else {
    if (!cachedData) {
      await execute('กำลังซิงค์ข้อมูล...', load);
    } else {
      load().catch(e => console.error(e));
    }
  }
}

function switchTab(tab) {
  currentTab = tab;
  ['pending', 'calendar', 'tracking'].forEach(name => {
    el('view-' + name).classList.toggle('hidden', name !== tab);
    const btn = el('tab-' + name);
    if (name === tab) {
      if (tab === 'pending') btn.className = 'py-2.5 rounded-xl text-xs font-extrabold transition shadow-sm bg-pink-500 text-white';
      else if (tab === 'calendar') btn.className = 'py-2.5 rounded-xl text-xs font-extrabold transition shadow-sm bg-[#38bdf8] text-white';
      else if (tab === 'tracking') btn.className = 'py-2.5 rounded-xl text-xs font-extrabold transition shadow-sm bg-purple-600 text-white';
    } else {
      btn.className = 'py-2.5 rounded-xl text-xs font-extrabold transition text-slate-500';
    }
  });
}

function renderTasks() {
  const pinned = el('pinned-list');
  const list = el('task-list');
  const tracking = el('tracking-list');

  pinned.innerHTML = '';
  list.innerHTML = '';
  tracking.innerHTML = '';
  selector.innerHTML = '';

  el('task-count').textContent = tasks.length + ' ITEMS';

  tasks.forEach(task => {

    option.value = task.id;
    option.textContent = task.subject + ' - ' + task.detail;

function createTaskCard(task) {
  const div = document.createElement('div');
  div.className = 'bg-white border border-slate-100 rounded-2xl p-3.5 shadow-sm space-y-2';

  const unsubmitted = getUnsubmitted(task);
  const total = TOTAL_STUDENTS + (task.extraUnsubmitted || []).filter(n => Number(n) > TOTAL_STUDENTS).length;
  const completed = Math.max(0, total - unsubmitted.length);
  const percent = total ? Math.round(completed / total * 100) : 0;

  div.innerHTML = `
    <div class="flex justify-between items-start gap-2">
      <div>
        <span class="text-[10px] bg-pink-50 text-pink-600 px-2 py-0.5 rounded-md font-extrabold border border-pink-100">
          ${escapeHtml(task.code)}
        </span>
        <h3 class="font-extrabold text-xs text-slate-800 mt-1">${escapeHtml(task.subject)}</h3>
        <p class="text-[11px] text-slate-600 mt-0.5 font-medium">${escapeHtml(task.detail)}</p>
        <div class="flex gap-3 mt-1.5 text-[10px] font-bold">
          <span class="text-slate-500">วันสั่ง: ${formatDate(task.assignDate)}</span>
          <span class="text-rose-500">กำหนดส่ง: ${formatDate(task.dueDate)}</span>
        </div>
      </div>

      <div class="flex gap-1.5">
        <button data-action="pin" class="text-amber-500 hover:text-amber-600 p-1" title="ปักหมุด">
          <i class="fa-solid fa-thumbtack"></i>
        </button>
        <button data-action="delete" class="text-rose-500 hover:text-rose-600 p-1" title="ลบ">
          <i class="fa-solid fa-trash"></i>
        </button>
      </div>
    </div>

    <div class="pt-1.5 border-t border-slate-100">
      <div class="flex justify-between items-center text-[10px] font-extrabold mb-2">
        <span class="text-emerald-600">ส่งแล้ว ${completed}/${total} (${percent}%)</span>
        <span class="text-rose-500">ยังไม่ส่ง (${unsubmitted.length})</span>
      </div>
      <div class="flex flex-wrap gap-1.5" data-students></div>
    </div>
  `;

  div.querySelector('[data-action="pin"]').onclick = () => togglePin(task.id);
  div.querySelector('[data-action="delete"]').onclick = () => deleteTask(task.id);

  const students = div.querySelector('[data-students]');
  unsubmitted.forEach(number => {
    const button = document.createElement('button');
    button.className = 'bg-rose-50 text-rose-600 px-2.5 py-1 rounded-lg text-[11px] font-bold border border-rose-100 hover:bg-rose-100 transition shadow-xs';
    button.textContent = number;
    button.onclick = () => toggleStudent(task.id, number);
    students.appendChild(button);
  });

  return div;
}

function getUnsubmitted(task) {
  const submitted = new Set((task.submitted || []).map(String));
  const extra = new Set((task.extraUnsubmitted || []).map(String));
  const result = [];

  for (let i = 1; i <= TOTAL_STUDENTS; i++) {
    if (!submitted.has(String(i))) result.push(String(i));
  }

  extra.forEach(number => {
    if (!submitted.has(number) && !result.includes(number)) result.push(number);
  });

  return result;
}

function toggleForm(id) {
  ['task-form', 'student-form', 'event-form'].forEach(name => {
    if (name !== id && el(name)) el(name).classList.add('hidden');
  });
  if(el(id)) el(id).classList.toggle('hidden');
}

async function sendSaveRequest(action, payloadData = null) {
  let bodyData = { action: action };
  if (action === 'saveTasks') bodyData.tasks = payloadData;
  if (action === 'saveEvents') bodyData.events = payloadData;

  await fetch(SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(bodyData)
  });

  await new Promise(resolve => setTimeout(resolve, 1500));
}

async function addTask() {
  const task = {
    id: String(Date.now()),
    code: el('task-code').value.trim(),
    subject: el('task-subject').value.trim(),
    detail: el('task-detail').value.trim(),
    assignDate: el('task-assign-date').value,
    dueDate: el('task-due-date').value,
    isPinned: false,
    submitted: [],
    extraUnsubmitted: []
  };

  if (!task.code || !task.subject || !task.detail || !task.dueDate) {
    showAlert('กรุณากรอกข้อมูลให้ครบ');
    return;
  }

  const isDuplicate = tasks.some(t => 
    t.code.toLowerCase() === task.code.toLowerCase() && 
    t.detail.toLowerCase() === task.detail.toLowerCase()
  );

  if (isDuplicate) {
    showAlert('แจ้งเตือน: มีการบันทึกงานซ้ำในระบบแล้ว!');
    return;
  }

  const updatedTasks = [task, ...tasks];

  const success = await execute('กำลังบันทึกการบ้าน...', async () => {
    await sendSaveRequest('saveTasks', updatedTasks);
  });

  if (success) {
    tasks = updatedTasks;
    const cachedData = JSON.parse(localStorage.getItem('homeworkCacheData') || '{}');
    cachedData.tasks = tasks;
    localStorage.setItem('homeworkCacheData', JSON.stringify(cachedData));

    ['task-code', 'task-subject', 'task-detail', 'task-assign-date', 'task-due-date'].forEach(id => el(id).value = '');
    el('task-form').classList.add('hidden');
    renderTasks();
    renderCalendar();
    selectDate(selectedDate);
    setStatus('บันทึกการบ้านเรียบร้อย');
    logActivity('เพิ่มการบ้าน', `วิชา ${task.subject} (${task.code}) - ${task.detail}`);
    showAlert('บันทึกการบ้านสำเร็จแล้ว');
  }
}

async function togglePin(id) {
  const task = tasks.find(t => String(t.id) === String(id));
  if (task) {
    task.isPinned = !task.isPinned;
    renderTasks();
    
    const cachedData = JSON.parse(localStorage.getItem('homeworkCacheData') || '{}');
    cachedData.tasks = tasks;
    localStorage.setItem('homeworkCacheData', JSON.stringify(cachedData));

    sendSaveRequest('saveTasks', tasks);
    logActivity(task.isPinned ? 'ปักหมุดการบ้าน' : 'ยกเลิกปักหมุด', `วิชา ${task.subject}`);
  }
}

async function deleteTask(id) {
  const task = tasks.find(t => String(t.id) === String(id));
  if (!confirm('ต้องการลบการบ้านนี้ใช่หรือไม่?')) return;

  tasks = tasks.filter(t => String(t.id) !== String(id));
  renderTasks();
  renderCalendar();
  selectDate(selectedDate);

  const cachedData = JSON.parse(localStorage.getItem('homeworkCacheData') || '{}');
  cachedData.tasks = tasks;
  localStorage.setItem('homeworkCacheData', JSON.stringify(cachedData));

  sendSaveRequest('saveTasks', tasks);

  if (task) {
    logActivity('ลบการบ้าน', `วิชา ${task.subject} - ${task.detail}`);
  }
}

async function toggleStudent(taskId, number) {
  const task = tasks.find(t => String(t.id) === String(taskId));
  if (!task) return;
  if (!Array.isArray(task.submitted)) task.submitted = [];

  const numStr = String(number);
  const idx = task.submitted.indexOf(numStr);
  const isSubmitted = idx === -1;
  
  if (!isSubmitted) task.submitted.splice(idx, 1);
  else task.submitted.push(numStr);

  renderTasks();
  selectDate(selectedDate);

  const cachedData = JSON.parse(localStorage.getItem('homeworkCacheData') || '{}');
  cachedData.tasks = tasks;
  localStorage.setItem('homeworkCacheData', JSON.stringify(cachedData));

  sendSaveRequest('saveTasks', tasks);

  logActivity('เปลี่ยนสถานะส่งงาน', `เลขที่ ${numStr} วิชา ${task.subject} (${isSubmitted ? 'ส่งแล้ว' : 'ยังไม่ส่ง'})`);
}

async function addExtraStudent() {
  const taskId = el('student-task-select').value;
  const number = el('student-number').value.trim();

  if (!taskId || !number) return;
  const task = tasks.find(t => String(t.id) === String(taskId));
  if (!task) return;

  if (!Array.isArray(task.extraUnsubmitted)) task.extraUnsubmitted = [];
  
  if (task.extraUnsubmitted.includes(number)) {
    showAlert('แจ้งเตือน: มีรายชื่อเลขที่นี้ในรายการคนค้างอยู่แล้ว!');
    return;
  }

  task.extraUnsubmitted.push(number);
  renderTasks();
    
  const cachedData = JSON.parse(localStorage.getItem('homeworkCacheData') || '{}');
  cachedData.tasks = tasks;
  localStorage.setItem('homeworkCacheData', JSON.stringify(cachedData));

  sendSaveRequest('saveTasks', tasks);
  logActivity('เพิ่มรายชื่อคนค้างงาน', `เลขที่ ${number} ในวิชา ${task.subject}`);

  showAlert('เพิ่มรายชื่อคนค้างสำเร็จแล้ว');

  el('student-number').value = '';
  el('student-form').classList.add('hidden');
}

function renderCalendar() {
  const year = calendarDate.getFullYear();
  const month = calendarDate.getMonth();

  el('calendar-month-year').textContent = calendarDate.toLocaleDateString('th-TH', { month: 'long', year: 'numeric' });

  const container = el('calendar-days');
  container.innerHTML = '';

  const firstDay = new Date(year, month, 1).getDay();
  const totalDays = new Date(year, month + 1, 0).getDate();

  for (let i = 0; i < firstDay; i++) container.appendChild(document.createElement('div'));

  for (let day = 1; day <= totalDays; day++) {
    const key = dateKey(new Date(year, month, day));
    const button = document.createElement('button');
    
    button.className = 'h-14 rounded-2xl transition flex flex-col items-center justify-start pt-2.5 relative p-1 ' +
      (key === selectedDate 
        ? 'border-2 border-[#38bdf8] bg-white text-[#38bdf8] font-black shadow-sm' 
        : 'bg-slate-50 text-slate-700 hover:bg-slate-100 border border-slate-100');
    button.onclick = () => selectDate(key);

    const dayText = document.createElement('span');
    dayText.className = 'text-sm font-extrabold leading-none mb-1';
    dayText.textContent = day;
    button.appendChild(dayText);

    const hasTask = tasks.some(t => {
      const assign = normalizeDateStr(t.assignDate);
      const due = normalizeDateStr(t.dueDate);
      return assign === key || due === key;
    });

    const rawEvent = dailyEvents[key];
    const eventsArr = Array.isArray(rawEvent) ? rawEvent : (rawEvent ? [rawEvent] : []);
    const hasEvent = eventsArr.length > 0 && eventsArr.some(e => String(e).trim() !== '');

    if (hasTask || hasEvent) {
      const dotsContainer = document.createElement('div');
      dotsContainer.className = 'flex gap-1 items-center justify-center';

      if (hasTask) {
        const pinkDot = document.createElement('span');
        pinkDot.className = 'w-1.5 h-1.5 rounded-full bg-pink-500 shadow-sm';
        dotsContainer.appendChild(pinkDot);
      }

      if (hasEvent) {
        const blueDot = document.createElement('span');
        blueDot.className = 'w-1.5 h-1.5 rounded-full bg-sky-400 shadow-sm';
        dotsContainer.appendChild(blueDot);
      }

      button.appendChild(dotsContainer);
    }

    container.appendChild(button);
  }
}

function changeMonth(direction) {
  calendarDate = new Date(calendarDate.getFullYear(), calendarDate.getMonth() + direction, 1);
  renderCalendar();
}

function selectDate(key) {
  selectedDate = key;
  renderCalendar();

  el('selected-date-label').textContent = 'รายการวันที่ ' + formatDate(key);

  const container = el('selected-date-tasks');
  container.innerHTML = '';

  const matches = tasks.filter(task => {
    const assign = normalizeDateStr(task.assignDate);
    const due = normalizeDateStr(task.dueDate);
    return assign === key || due === key;
  });
  el('selected-date-count').textContent = matches.length + ' รายการ';

  matches.forEach(task => container.appendChild(createTaskCard(task)));
  if (!matches.length) container.innerHTML = '<p class="text-xs text-slate-500 text-center py-2 font-bold">ไม่มีรายการในวันนี้</p>';

  const eventList = el('event-list');
  eventList.innerHTML = '';
  
  const rawEvent = dailyEvents[key];
  const events = Array.isArray(rawEvent) ? rawEvent : (rawEvent ? [rawEvent] : []);

  events.forEach((event, index) => {
    const div = document.createElement('div');
    div.className = 'bg-sky-50 text-sky-800 rounded-xl p-2 text-xs border border-sky-100 font-bold flex justify-between items-center';
    
    const span = document.createElement('span');
    span.textContent = event;
    div.appendChild(span);

    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'text-rose-500 hover:text-rose-700 px-1.5 py-0.5 text-xs';
    deleteBtn.innerHTML = '<i class="fa-solid fa-trash"></i>';
    deleteBtn.onclick = () => deleteEvent(key, index);
    div.appendChild(deleteBtn);

    eventList.appendChild(div);
  });

  if (!eventList.children.length) eventList.innerHTML = '<p class="text-[11px] text-slate-500 font-semibold">ไม่มีกิจกรรมพิเศษ</p>';
}

async function addEvent() {
  const event = el('event-input').value.trim();
  if (!event) return;

  if (!dailyEvents[selectedDate]) dailyEvents[selectedDate] = [];
  else if (!Array.isArray(dailyEvents[selectedDate])) dailyEvents[selectedDate] = [dailyEvents[selectedDate]];

  if (dailyEvents[selectedDate].includes(event)) {
    showAlert('แจ้งเตือน: มีกิจกรรมนี้ในวันนี้อยู่แล้ว!');
    return;
  }

  dailyEvents[selectedDate].push(event);

  selectDate(selectedDate);
  el('event-input').value = '';
  el('event-form').classList.add('hidden');

  const cachedData = JSON.parse(localStorage.getItem('homeworkCacheData') || '{}');
  cachedData.events = dailyEvents;
  localStorage.setItem('homeworkCacheData', JSON.stringify(cachedData));

  sendSaveRequest('saveEvents', dailyEvents);

  logActivity('เพิ่มกิจกรรม', `วันที่ ${formatDate(selectedDate)}: ${event}`);

  showAlert('เพิ่มกิจกรรมสำเร็จแล้ว');
}

async function deleteEvent(key, index) {
  if (!confirm('ต้องการลบกิจกรรมนี้ใช่หรือไม่?')) return;

  const rawEvent = dailyEvents[key];
  const events = Array.isArray(rawEvent) ? rawEvent : (rawEvent ? [rawEvent] : []);

  if (events.length > 0) {
    const removed = events.splice(index, 1);
    if (events.length === 0) delete dailyEvents[key];
    else dailyEvents[key] = events;

    selectDate(selectedDate);

    const cachedData = JSON.parse(localStorage.getItem('homeworkCacheData') || '{}');
    cachedData.events = dailyEvents;
    localStorage.setItem('homeworkCacheData', JSON.stringify(cachedData));

    sendSaveRequest('saveEvents', dailyEvents);
    logActivity('ลบกิจกรรม', `วันที่ ${formatDate(key)}: ${removed}`);
  }
}

  }

  try {
    const logs = await fetchJSON(`${SCRIPT_URL}?action=getLogs&all=${fetchAll ? 'true' : 'false'}&t=${Date.now()}`);
    const container = el('modal-content');
    container.innerHTML = '';

    const topBtns = document.createElement('div');
    topBtns.className = 'flex gap-2 mb-3';

    topBtns.innerHTML = `
      <button onclick="clearLogs()" class="w-1/2 bg-rose-50 text-rose-600 rounded-xl py-2 text-xs font-bold border border-rose-100">ล้างประวัติทั้งหมด</button>
      <button onclick="isAllLogsLoaded = !isAllLogsLoaded; openLogs();" class="w-1/2 bg-pink-50 text-pink-700 rounded-xl py-2 text-xs font-bold border border-pink-100">
        ${fetchAll ? 'แสดง 20 ล่าสุด' : 'โหลดทั้งหมด'}
      </button>
    `;
    container.appendChild(topBtns);

    if (Array.isArray(logs) && logs.length > 0) {
      const listToShow = [...logs].reverse();

      const logListContainer = document.createElement('div');
      logListContainer.className = 'space-y-2 max-h-[350px] overflow-y-auto pr-1';

      listToShow.forEach(log => {
        const item = document.createElement('div');
        item.className = 'bg-slate-50 border border-slate-100 p-2.5 rounded-xl text-xs space-y-1';
        item.innerHTML = `
          <div class="flex justify-between items-center">
            <span class="font-extrabold text-pink-600 bg-pink-50 px-2 py-0.5 rounded-md text-[10px] border border-pink-100">${escapeHtml(log.actionText || 'กิจกรรม')}</span>
            <span class="text-[10px] text-slate-400 font-semibold">${log.timestamp ? new Date(log.timestamp).toLocaleString('th-TH') : '-'}</span>
          </div>
          <p class="text-slate-800 font-semibold text-[11px]">${escapeHtml(log.details || '-')}</p>
          <p class="text-[10px] text-slate-500">โดย: <span class="font-bold text-slate-700">${escapeHtml(log.username || 'System')}</span></p>
        `;
        logListContainer.appendChild(item);
      });
      container.appendChild(logListContainer);
    } else {
      container.innerHTML += '<p class="text-xs text-slate-500 text-center py-4 font-bold">ไม่มีประวัติการใช้งาน</p>';
    }
  } catch (error) {
    el('modal-content').textContent = error.message;
  }
}

async function clearLogs() {
  if (!confirm('ล้างประวัติทั้งหมดใช่หรือไม่?')) return;

  await execute('กำลังล้างประวัติ...', async () => {
    await sendSaveRequest('clearLogs');
  });

  isAllLogsLoaded = false;
  openLogs();
}

function logActivity(actionText, details) {
  fetch(SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({
      action: 'saveLog',
      username: currentUser ? currentUser.username : 'Unknown',
      actionText: actionText,
      details: details
    })
  }).catch(e => console.error('Log Error:', e));
}

document.addEventListener('DOMContentLoaded', async () => {
  const lastUser = localStorage.getItem('homeworkLastUser');
  if (lastUser) {
    el('username').value = lastUser;
  }

  const saved = sessionStorage.getItem('homeworkUser');
  if (saved) {
    try {
      currentUser = JSON.parse(saved);
      el('login-page').classList.add('hidden');
      el('main-page').classList.remove('hidden');
      el('user-display').textContent = currentUser.name;
      
      updateAdminUI();
      switchTab('pending'); // กำหนดหน้าแรกเป็น "ภาพรวมงานค้าง" เมื่อเปิดแอปด้วย session เดิม

      await loadAllData(false);
    } catch (error) {
      sessionStorage.removeItem('homeworkUser');
    }
  }
});
</script>
